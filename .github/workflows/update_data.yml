name: Daily ETF Data Update

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-legacy-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # 排隊後執行時要拿最新版本，否則 data.json 會和前一次提交衝突

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx yfinance pandas

      - name: Run update script
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python update_etf.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          cp data.json docs/data.json

          # 一般 commit，保留歷史（不可用 orphan／force push，否則會蓋掉程式修改紀錄）
          git add data.json docs/data.json baseline.json
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Auto-update ETF data $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
